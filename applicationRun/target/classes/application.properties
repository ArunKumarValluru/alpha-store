spring.application.name=alphaStores
server.port=8080

# ---------------- Database ----------------
# values come from environment variables; never commit real passwords
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/usermgmt_data_alpha_store}
spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=${DB_PASSWORD:password}

# connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# tables are created in the DB, so Hibernate only checks the entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
